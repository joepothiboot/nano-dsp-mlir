name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Apple Silicon + Homebrew LLVM, matching the development setup that
    # test.sh and gen_demo.py auto-detect.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR, Ninja and lit
        run: |
          brew install llvm ninja
          pip3 install --break-system-packages lit
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build nanodsp-opt and run MLIR lit tests
        run: ./test.sh

      - name: Generate the demo page
        run: python3 scripts/gen_demo.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
