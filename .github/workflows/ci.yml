name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3 --check .

  test:
    # Apple Silicon + Homebrew LLVM, matching the development setup that
    # test.sh auto-detects.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR, Ninja and lit
        run: |
          brew install llvm ninja
          pip3 install --break-system-packages lit
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: MLIR lit tests
        run: ./test.sh

      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: C++ reference golden tests
        run: pixi run test-reference

      # Builds the benchmark kernels and checks them against the C++
      # reference; no timing on shared runners.
      - name: Benchmark kernels (correctness only)
        run: pixi run bench-check

      - name: Mojo kernel tests
        run: pixi run test-mojo
