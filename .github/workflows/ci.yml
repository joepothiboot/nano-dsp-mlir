name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3 --check .

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR, Ninja and lit
        run: |
          brew install llvm ninja
          pip3 install --break-system-packages lit
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: MLIR lit tests
        run: ./test.sh

      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: C++ reference golden tests
        run: pixi run test-reference

      - name: Benchmark kernels (correctness only)
        run: pixi run bench-check

      - name: Mojo kernel tests
        run: pixi run test-mojo

  notify-lab:
    needs: [format, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Tell compiler-tooling-lab to re-pin
        env:
          GH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: >
          gh api repos/joepothiboot/compiler-tooling-lab/dispatches
          -f event_type=project-release
          -f "client_payload[project]=nano-dsp-mlir"
          -f "client_payload[ref]=$GITHUB_REF_NAME"
