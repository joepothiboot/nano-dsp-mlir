[workspace]
name = "nano-dsp-mlir"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "1.1.*"
max-core = "26.6.*"

[tasks]
test-kernels = "mojo run --fp-mode contract=off -I mojo mojo/tests/test_kernels.mojo"
test-layout = "mojo run --fp-mode contract=off -I mojo mojo/tests/test_layout.mojo"
test-mojo = { depends-on = ["test-kernels", "test-layout"] }
bench = "mojo run --fp-mode contract=off -I mojo benchmarks/bench_kernels.mojo"
test-gpu = "mojo run --fp-mode contract=off -I mojo mojo/tests/test_gpu.mojo"
bench-gpu = "mkdir -p build/bench && mojo run --fp-mode contract=off -I mojo -I benchmarks benchmarks/bench_gpu.mojo > build/bench/results-gpu.json && cat build/bench/results-gpu.json"
test-reference = { cmd = "mkdir -p build && c++ -std=c++20 -O2 -ffp-contract=off -Wall -Wextra -o build/test_reference reference/test_reference.cpp && build/test_reference" }
test-reference-asan = { cmd = "mkdir -p build && c++ -std=c++20 -O1 -g -ffp-contract=off -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -o build/test_reference_asan reference/test_reference.cpp && build/test_reference_asan" }
test-mlir = "./test.sh"
bench-check = "scripts/bench.sh --check"
bench-mlir = "scripts/bench.sh"
bench-t4 = "bash scripts/run-t4.sh"
