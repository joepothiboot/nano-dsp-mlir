[workspace]
name = "nano-dsp-mlir"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "1.1.*"

[tasks]
# --fp-mode contract=off: Mojo fuses `a + b * c` into an FMA by default; the
# bit-exact tests (and the C++ reference, built with -ffp-contract=off) need
# the multiply and the add rounded separately.
test-mojo = "mojo run --fp-mode contract=off -I mojo mojo/tests/test_kernels.mojo"
bench = "mojo run --fp-mode contract=off -I mojo benchmarks/bench_kernels.mojo"
test-reference = { cmd = "mkdir -p build && c++ -std=c++20 -O2 -ffp-contract=off -Wall -Wextra -o build/test_reference reference/test_reference.cpp && build/test_reference" }
test-mlir = "./test.sh"
